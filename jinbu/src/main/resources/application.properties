server.port=${PORT:9090}
spring.application.name=jinbu

# Database config (Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Max image size
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# AWS/Supabase S3 config
cloud.aws.credentials.access-key=${S3_ACCESS_KEY}
cloud.aws.credentials.secret-key=${S3_SECRET_KEY}
cloud.aws.region.static=${S3_REGION:us-east-1}
cloud.aws.s3.endpoint=${S3_ENDPOINT}

aws.bucket.name=${S3_BUCKET_NAME}
aws.bucket.name2=${S3_BUCKET_NAME_PROFILE:profile-pictures}


